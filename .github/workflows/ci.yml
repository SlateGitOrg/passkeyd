name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # v2.15.0 bundles golang.org/x/tools v0.52.0, which reads the export data
      # written by Go 1.27.3. v2.13.2 (x/tools v0.49.0) fails to type-check the
      # standard library with "export data version 5 is greater than maximum
      # supported version 4".
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Format check
        run: make fmt-check
      - name: Vet / type-check
        run: make vet
      - name: Lint
        run: make lint

  test:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Race tests
        run: make test
      - name: Coverage gate (core packages >= 80%)
        run: make cover

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: make build
      - name: Offline demo
        run: make demo
